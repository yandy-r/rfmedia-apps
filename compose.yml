    image: ${HEADROOM_IMAGE:-ghcr.io/headroomlabs-ai/headroom}:${HEADROOM_TAG:-0.37.0}@${HEADROOM_DIGEST:-sha256:4e559273659ebc5ce8711a60278e288550fa596377af18a7058e10036d63ef0b}

  forgejo-postgres:
    <<: *service-base
    container_name: forgejo-postgres
    hostname: forgejo-postgres
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_USER: ${FORGEJO_DB_USER:-forgejo}
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      POSTGRES_DB: ${FORGEJO_DB_NAME:-forgejo}
    volumes:
      - ${DOCKER_DATA_DIR}/forgejo-postgres:/var/lib/postgresql/data
    image: docker.io/library/postgres:16-alpine

  forgejo:
    <<: *service-base
    container_name: forgejo
    hostname: forgejo
    networks:
      apps: {}
    user: "${PUID}:${PGID}"
    logging: *logging-default
    healthcheck:
      test: curl --fail --silent --show-error http://localhost:3000/api/healthz || curl --fail --silent --show-error http://localhost:3000 || exit 1
      interval: 15s
      retries: 8
      start_period: 60s
      timeout: 10s
    environment:
      <<: *common-env
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-postgres
      FORGEJO__database__PORT: 5432
      FORGEJO__database__NAME: ${FORGEJO_DB_NAME:-forgejo}
      FORGEJO__database__USER: ${FORGEJO_DB_USER:-forgejo}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://git.${TS_DOMAIN}/
      FORGEJO__server__SSH_DOMAIN: git.${TS_DOMAIN}
      FORGEJO__server__SSH_PORT: 22
      FORGEJO__actions__ENABLED: true
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://data.forgejo.org
    labels:
      traefik.enable: true
      traefik.http.routers.forgejo.rule: Host(`git.${DOMAIN}`) || Host(`forgejo.${DOMAIN}`)
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.tls: true
      traefik.http.routers.forgejo.tls.certresolver: letsencrypt
      traefik.http.routers.forgejo.tls.domains[0].main: git.${DOMAIN}
      traefik.http.routers.forgejo.tls.domains[1].main: forgejo.${DOMAIN}
      traefik.http.services.forgejo.loadbalancer.server.port: 3000
      traefik.http.services.forgejo.loadbalancer.server.scheme: http
      <<: *tsdproxy-rfapps
      tsdproxy.name: "git"
      tsdproxy.dash.label: "Forgejo"
      tsdproxy.port.1: "443/https:3000/http"
      tsdproxy.port.2: "22/tcp:2222/tcp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_DIR}/forgejo:/var/lib/gitea
    depends_on:
      forgejo-postgres:
        condition: service_healthy
    image: codeberg.org/forgejo/forgejo:15-rootless

