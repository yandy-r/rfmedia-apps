    image: ghcr.io/yandy-r/praxrr:develop

  plex:
    <<: *service-base
    container_name: plex
    hostname: plex
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: curl --fail --silent http://localhost:32400/identity || exit 1
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 10s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    environment:
      <<: *common-env
      PLEX_UID: ${PUID}
      PLEX_GID: ${PGID}
      DEBUG: no
      VERSION: latest
      PLEX_CLAIM_TOKEN: ${PLEX_CLAIM}
      PLEX_BETA_INSTALL: true
      PLEX_ADVERTISE_URL: ${PLEX_ADVERTISE_URL}
      DOCKER_MODS: ghcr.io/themepark-dev/theme.park:plex|linuxserver/mods:plex-absolute-hama|linuxserver/mods:plex-audnexus
      TP_THEME: ${TP_THEME}
      #-------------------------------------------------------------------------
      # If you have an nvidia GPU
      #-------------------------------------------------------------------------
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      #-------------------------------------------------------------------------
    labels:
      traefik.enable: true
      traefik.http.routers.plex.rule: Host(`plex.${DOMAIN2}`)
      traefik.http.routers.plex.entrypoints: websecure
      traefik.http.routers.plex.tls: true
      traefik.http.routers.plex.tls.certresolver: letsencrypt
      traefik.http.routers.plex.tls.domains[0].main: plex.${DOMAIN2}
      traefik.http.routers.plex.service: plex
      # Public Cloudflare Tunnel hostname (infra/terraform/cloudflare); same backend as plex.
      traefik.http.routers.plex-sync.rule: Host(`plex-sync.${DOMAIN2}`)
      traefik.http.routers.plex-sync.entrypoints: websecure
      traefik.http.routers.plex-sync.tls: true
      traefik.http.routers.plex-sync.tls.certresolver: letsencrypt
      traefik.http.routers.plex-sync.tls.domains[0].main: plex-sync.${DOMAIN2}
      traefik.http.routers.plex-sync.service: plex
      traefik.http.services.plex.loadbalancer.server.port: 32400
      traefik.http.services.plex.loadbalancer.server.scheme: https
      <<: *tsdproxy-rfapps
      tsdproxy.name: "plex"
      tsdproxy.dash.label: "Plex"
      # Plex serves HTTPS on 32400 with a self-signed cert (same as Traefik scheme: https)
      tsdproxy.port.1: "443/https:32400/https, no_tlsvalidate"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Plex config directory - has to be on host filesyste, it writes a lot of small files
      # Will break transcoding and slowdown streaming if put on a network share
      - ${PLEX_DOCKER_DIR}/plex:/config
      - ${PLEX_DOCKER_DIR}/plex-transcode:/transcode
      - ${DATA_DIR}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    image: ghcr.io/hotio/plex

