      PRAXRR_SCHEMA_REF: develop
      ARR_CREDENTIAL_MASTER_KEY: ${ARR_CREDENTIAL_MASTER_KEY}
      ARR_CREDENTIAL_MASTER_KEY_VERSION: v1
      # ARR_CREDENTIAL_PREVIOUS_KEYS: ${ARR_CREDENTIAL_PREVIOUS_KEYS} # optional: JSON map for key rotation
      # Optional Arr instances via environment at startup
      LIDARR_INSTANCE_NAME_1: Lidarr # Optional (Generated if not provided)
      LIDARR_INSTANCE_URL_1: http://lidarr:8686
      LIDARR_INSTANCE_EXTERNAL_URL_1: ${LIDARR_EXTERNAL_URL} # Optional
      LIDARR_INSTANCE_API_KEY_1: ${LIDARR_API_KEY}
      LIDARR_INSTANCE_TAGS_1: music,flac,lossless
      RADARR_INSTANCE_NAME_1: Radarr # Optional (Generated if not provided)
      RADARR_INSTANCE_URL_1: http://radarr:7878
      RADARR_INSTANCE_EXTERNAL_URL_1: ${RADARR_EXTERNAL_URL} # Optional
      RADARR_INSTANCE_API_KEY_1: ${RADARR_API_KEY}
      RADARR_INSTANCE_TAGS_1: movies,4k
      SONARR_INSTANCE_NAME_1: Sonarr # Optional (Generated if not provided)
      SONARR_INSTANCE_URL_1: http://sonarr:8989
      SONARR_INSTANCE_EXTERNAL_URL_1: ${SONARR_EXTERNAL_URL} # Optional
      SONARR_INSTANCE_API_KEY_1: ${SONARR_API_KEY}
      SONARR_INSTANCE_TAGS_1: tv,4k
      PRAXRR_VALIDATE_INSTANCES: false
      PULL_ON_START: true
      PULL_ON_START_MAX_CONCURRENCY: 3
      PULL_ON_START_TIMEOUT_MS: 30000
    labels:
