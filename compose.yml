    healthcheck:
      test: curl --fail --silent  http://localhost:6868 || exit 1
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 5s
    environment:
      <<: *common-env
      AUTH: off
      PRAXRR_PCD_MIGRATION_MODE: ${PRAXRR_PCD_MIGRATION_MODE:-hybrid}
      PRAXRR_PCD_MIGRATION_ALLOW_LEGACY_FALLBACK: ${PRAXRR_PCD_MIGRATION_ALLOW_LEGACY_FALLBACK:-false}
      PRAXRR_DEFAULT_DB_URL: ${PRAXRR_DEFAULT_DB_URL:-https://github.com/${PRAXRR_DEFAULT_DB_GIT_USERNAME}/praxrr-db}
