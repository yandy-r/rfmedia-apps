      test: curl --fail --silent --show-error http://localhost:8080 || exit 1
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 5s
    environment:
      <<: *common-env
    labels:
      traefik.enable: true
      traefik.http.routers.watchstate.rule: Host(`watchstate.${DOMAIN2}`)
      traefik.http.routers.watchstate.entrypoints: websecure
      traefik.http.routers.watchstate.tls: true
      traefik.http.routers.watchstate.tls.certresolver: letsencrypt
      traefik.http.routers.watchstate.tls.domains[0].main: watchstate.${DOMAIN2}
      traefik.http.services.watchstate.loadbalancer.server.port: 8080
      traefik.http.services.watchstate.loadbalancer.server.scheme: http
      traefik.http.routers.watchstate.middlewares: authentik-media@docker
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_DIR}/watchstate:/config
    image: ghcr.io/arabcoders/watchstate:latest

  immich-server:
    <<: *service-base
    container_name: immich-server
    hostname: immich-server
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: curl --fail --silent --show-error http://localhost:2283/api/server/ping || exit 1
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 5s
    environment:
      <<: *common-env
      DB_NAME: ${IMMICH_DB_NAME}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_HOSTNAME: immich-postgres
      DB_PORT: 5432
      REDIS_HOSTNAME: immich-redis
      REDIS_PORT: 6379
    labels:
      traefik.enable: true
      traefik.http.routers.immich.rule: Host(`images.${DOMAIN2}`)
      traefik.http.routers.immich.entrypoints: websecure
      traefik.http.routers.immich.tls: true
      traefik.http.routers.immich.tls.certresolver: letsencrypt
      traefik.http.routers.immich.tls.domains[0].main: images.${DOMAIN2}
      traefik.http.services.immich.loadbalancer.server.port: 2283
      traefik.http.services.immich.loadbalancer.server.scheme: http
      <<: *tsdproxy-rfapps
      tsdproxy.name: "images"
      tsdproxy.dash.label: "Immich"
      tsdproxy.port.1: "443/https:2283/http"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_DIR}/immich:/config
      - ${DATA_DIR}/photos:/data
    depends_on:
      - immich-ml
      - immich-postgres
      - immich-redis
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}

  immich-ml:
    <<: *service-base
    container_name: immich-ml
    hostname: immich-ml
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -Eq 'immich|machine-learning|python'"]
      interval: 20s
      retries: 5
      start_period: 40s
      timeout: 5s
    environment:
      <<: *common-env
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /dev/bus/usb:/dev/bus/usb
      - model-cache:/cache
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino

  immich-redis:
    <<: *service-base
    container_name: immich-redis
    hostname: immich-redis
    networks:
      apps: {}
    healthcheck:
      test: redis-cli ping || exit 1
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    logging: *logging-default
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa

  immich-postgres:
    <<: *service-base
    container_name: immich-postgres
    hostname: immich-postgres
    networks:
      apps: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DOCKER_DIR}/immich-postgres:/var/lib/postgresql/data
    shm_size: 128mb
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23

  # Native API-key auth guards Traefik + tsdproxy ingress (no Authentik, no host ports).
  # AMD GPU via ROCm: gfx1201 render node + /dev/kfd are mapped (no privileged);
  # host needs amdgpu kernel driver only (no ROCm userland install).
  llama:
    <<: *service-base
    container_name: llama
    hostname: llama
    user: "${PUID}:${PGID}"
    group_add:
      # render group for /dev/dri/renderD129 access (host amdgpu render node)
      - ${LLAMA_RENDER_GID:-993}
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: curl --fail --silent http://localhost:8080/health || exit 1
      interval: 15s
      retries: 5
      # 14B Q4 (~8.4 GB) mmap load from cold cache can take minutes
      start_period: 300s
      timeout: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      # ROCm kernel/compute cache lives under XDG_CACHE_HOME=/tmp
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      TZ: ${TZ}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    command:
      - --api-key-file
      - /run/secrets/llama-api-keys
      - --model
      - /models/${LLAMA_MODEL_FILE:-gemma-3-1b-it-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Explicit GPU: fail loudly instead of silently falling back to CPU
      - --device
      - ROCm0
      - --gpu-layers
      - "99"
      - --ctx-size
      - "32768"
      - --parallel
      - "1"
      # Bound host-side prompt cache; model mmap/offload needs >4 GiB at load.
      - --cache-ram
      - "512"
      - --no-ui
      # Include backend device and layer-offload evidence in startup logs.
      - --log-verbosity
      - "4"
    labels:
      traefik.enable: true
      traefik.http.routers.llama.rule: Host(`llama.${DOMAIN}`)
      traefik.http.routers.llama.entrypoints: websecure
      traefik.http.routers.llama.tls: true
      traefik.http.routers.llama.tls.certresolver: letsencrypt
      traefik.http.routers.llama.tls.domains[0].main: llama.${DOMAIN}
      traefik.http.services.llama.loadbalancer.server.port: 8080
      traefik.http.services.llama.loadbalancer.server.scheme: http
      <<: *tsdproxy-rfapps
      tsdproxy.name: "llama"
      tsdproxy.dash.label: "llama"
      tsdproxy.port.1: "443/https:8080/http"
    expose:
      - "8080"
    devices:
      # AMD RX 9070 XT render node (stable by-path; Intel iGPU is NOT mapped)
      # + /dev/kfd for ROCm compute (both group render 993; gid stays 993).
      # Long syntax: the by-path name contains a colon, short syntax is ambiguous.
      - source: /dev/dri/by-path/pci-0000:07:00.0-render
        target: /dev/dri/renderD129
        permissions: rw
      - source: /dev/kfd
        target: /dev/kfd
        permissions: rw
    volumes:
      - ${DOCKER_DIR}/llama/models:/models:ro
      - type: bind
        source: ${DOCKER_DIR}/llama/api-keys
        target: /run/secrets/llama-api-keys
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources: { limits: { cpus: "4.0", memory: 16G, pids: 128 } }
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11146@sha256:a4d07a422c64467bd3f4177b2721ba1e0bf1af187618a265b71e9cef9e830639
