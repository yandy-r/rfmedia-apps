      traefik.http.routers.praxrr.rule: Host(`praxrr.${DOMAIN2}`)
      traefik.http.routers.praxrr.entrypoints: websecure
      traefik.http.routers.praxrr.tls: true
      traefik.http.routers.praxrr.tls.certresolver: letsencrypt
      traefik.http.routers.praxrr.tls.domains[0].main: praxrr.${DOMAIN2}
