# ==================================================================================================
# Docker Compose File for rfmedia-apps
# ==================================================================================================
# This file is used to deploy the rfmedia-apps Docker self-hosting platform.
# It is a Docker Compose file that defines the services and their configurations.
# ==================================================================================================
# Last Updated: 2026-06-17
# Current Status: Stable
# ==================================================================================================
# This file is part of the rfmedia-apps Docker self-hosting platform.
# ==================================================================================================

name: rfmedia-apps

# ==================================================================================================
# Networks
# ==================================================================================================
networks:
  apps:
    name: apps
    driver: bridge
    ipam:
      driver: default

# ==================================================================================================
# Volumes
# ==================================================================================================
volumes:
  model-cache:
    name: model-cache
    driver: local

# ==================================================================================================
# Logging
# ==================================================================================================
x-logging-default: &logging-default
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

# ==================================================================================================
# Service Base
# ==================================================================================================
x-service-base: &service-base
  restart: unless-stopped
  pull_policy: always

# ==================================================================================================
# Common Environment
# ==================================================================================================
x-common-env: &common-env
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

# ==================================================================================================
# tsdproxy-rfapps labels
# ==================================================================================================
# Pin hosts to Tailscale provider `rfapps` so a second tsdproxy on the same Docker
# socket (praxrr-tsdproxy) does not register duplicate machines (git / git-1).
x-tsdproxy-rfapps: &tsdproxy-rfapps
  tsdproxy.enable: "true"
  tsdproxy.proxyprovider: "rfapps"
  tsdproxy.ephemeral: "false"

# ==================================================================================================
# Services
# ==================================================================================================
services:
  docktail:
    <<: *service-base
    container_name: docktail
    hostname: docktail
    networks:
      apps: {}
    logging: *logging-default
    environment:
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET}
      DEFAULT_SERVICE_TAGS: ${DOCKTAIL_DEFAULT_SERVICE_TAGS:-tag:container}
      LOG_LEVEL: ${DOCKTAIL_LOG_LEVEL:-info}
      RECONCILE_INTERVAL: ${DOCKTAIL_RECONCILE_INTERVAL:-60s}
      DELETE_UNUSED_SERVICES: ${DOCKTAIL_DELETE_UNUSED_SERVICES:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    image: ghcr.io/marvinvr/docktail:latest

  tsdproxy-rfapps:
    <<: *service-base
    container_name: tsdproxy-rfapps
    hostname: tsdproxy-rfapps
    networks:
      apps: {}
    logging: *logging-default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DIR}/tsdproxy-rfapps/data:/data
      - ${DOCKER_DIR}/tsdproxy-rfapps/config:/config
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    image: almeidapaulopt/tsdproxy:2

  traefik-ts:
    hostname: traefik-ts
    container_name: traefik-ts
    restart: unless-stopped
    networks:
      apps:
        aliases:
          - traefik
    logging: *logging-default
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json >/dev/null 2>&1"]
      interval: 20s
      retries: 5
      start_period: 40s
      timeout: 10s
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TS_ACCEPT_DNS: false
      TS_EXTRA_ARGS: --accept-routes=false --accept-dns=false --advertise-tags=tag:docker,tag:network
      TS_HOSTNAME: traefik
    volumes:
      - ${DOCKER_DIR}/traefik-ts:/var/lib/tailscale
    image: tailscale/tailscale:latest

  traefik:
    <<: *service-base
    container_name: traefik
    network_mode: service:traefik-ts
    logging: *logging-default
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      <<: *common-env
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      DOMAIN: ${DOMAIN}
      DOMAIN2: ${DOMAIN2}
      TS_DOMAIN: ${TS_DOMAIN}
      HOMEAUTO_SERVER: ${HOMEAUTO_SERVER}
      NAS01_IP: ${NAS01_IP}
      NAS02_IP: ${NAS02_IP}
      UNIFI_GW_IP: ${UNIFI_GW_IP}
      OC_UBDEVSRV_URL: ${OC_UBDEVSRV_URL}
      OC_UBSRV_URL: ${OC_UBSRV_URL}
      OC_G7_URL: ${OC_G7_URL}
    command:
      - --log
      - --log.level=${LOG_LEVEL:-INFO}
      - --log.format=json
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --providers.docker.allowemptyservices=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --serversTransport.insecureSkipVerify=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.postgres-tcp.address=:15432
      - --entrypoints.mysql-tcp.address=:13306
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.letsencrypt.acme.email=${CF_API_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=5
    labels:
      traefik.enable: true
      traefik.http.routers.api.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.api.service: api@internal
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: true
      traefik.http.routers.api.tls.certresolver: letsencrypt
      traefik.http.routers.api.tls.domains[0].main: traefik.${DOMAIN}
      traefik.http.services.api.loadbalancer.server.port: 8080
      traefik.http.services.api.loadbalancer.server.scheme: http
      traefik.http.routers.api.middlewares: authentik-dev@docker
    depends_on:
      - traefik-ts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DIR}/traefik:/etc/traefik
      - ${DOCKER_DIR}/traefik/config:/etc/traefik/dynamic
    image: traefik:v3

  cloudflared:
    <<: *service-base
    container_name: cloudflared
    hostname: cloudflared
    user: "${PUID}:${PGID}"
    networks:
      apps: {}
    logging: *logging-default
    # Remotely-managed tunnel: ingress + DNS live in infra/terraform/cloudflare (npm run tf:plan:apply cloudflare).
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      <<: *common-env
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 10s
    image: cloudflare/cloudflared:latest

  authentik-server:
    <<: *service-base
    container_name: authentik-server
    hostname: authentik-server
    networks:
      apps: {}
    command: server
    logging: *logging-default
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/ready/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      <<: *common-env
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASSWORD}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL_USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: ${AUTHENTIK_EMAIL_TIMEOUT:-10}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM}
      AUTHENTIK_STORAGE__MEDIA__BACKEND: ${AUTHENTIK_STORAGE__MEDIA__BACKEND:-file}
      AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME: ${AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME:-""}
      AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY: ${AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY:-""}
      AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY: ${AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY:-""}
      AUTHENTIK_STORAGE__MEDIA__S3__REGION: ${AUTHENTIK_STORAGE__MEDIA__S3__REGION:-"us-east-1"}
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000 # derfault only here for reference
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443 # derfault only here for reference
    labels:
      traefik.enable: true
      traefik.http.routers.authentik-dev.rule: Host(`authentik.${DOMAIN}`) || (Host(`authentik.${DOMAIN}`) && Path(`/outpost.goauthentik.io/`))
      traefik.http.routers.authentik-dev.entrypoints: websecure
      traefik.http.routers.authentik-dev.tls: true
      traefik.http.routers.authentik-dev.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-dev.tls.domains[0].main: authentik.${DOMAIN}
      traefik.http.routers.authentik-dev.service: authentik-dev
      traefik.http.services.authentik-dev.loadbalancer.server.port: 9443
      traefik.http.services.authentik-dev.loadbalancer.server.scheme: https
      traefik.http.middlewares.authentik-dev.forwardauth.address: https://authentik-server:9443/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik-dev.forwardauth.tls.insecureSkipVerify: true
      traefik.http.middlewares.authentik-dev.forwardauth.trustForwardHeader: true
      traefik.http.middlewares.authentik-dev.forwardauth.maxResponseBodySize: "1048576"
      traefik.http.middlewares.authentik-dev.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
      traefik.http.routers.authentik-media.rule: Host(`authentik.${DOMAIN2}`) || (Host(`authentik.${DOMAIN2}`) && Path(`/outpost.goauthentik.io/`))
      traefik.http.routers.authentik-media.entrypoints: websecure
      traefik.http.routers.authentik-media.tls: true
      traefik.http.routers.authentik-media.tls.certresolver: letsencrypt
      traefik.http.routers.authentik-media.tls.domains[0].main: authentik.${DOMAIN2}
      traefik.http.routers.authentik-media.service: authentik-media
      traefik.http.services.authentik-media.loadbalancer.server.port: 9443
      traefik.http.services.authentik-media.loadbalancer.server.scheme: https
      traefik.http.middlewares.authentik-media.forwardauth.address: https://authentik-media:9443/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik-media.forwardauth.tls.insecureSkipVerify: true
      traefik.http.middlewares.authentik-media.forwardauth.trustForwardHeader: true
      traefik.http.middlewares.authentik-media.forwardauth.maxResponseBodySize: "1048576"
      traefik.http.middlewares.authentik-media.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
    volumes:
      - ${DOCKER_DIR}/authentik-server/data:/data
      - ${DOCKER_DIR}/authentik-server/custom-templates:/templates
      - ${DOCKER_DIR}/letsencrypt/certs/live:/certs
    depends_on:
      - authentik-db
      - authentik-redis
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.12}

  authentik-worker:
    <<: *service-base
    container_name: authentik-worker
    hostname: authentik-worker
    networks:
      apps: {}
    command: worker
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -Eq 'worker|celery'"]
      interval: 20s
      retries: 5
      start_period: 40s
      timeout: 5s
    environment:
      <<: *common-env
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_ERROR_REPORTING__ENABLED: true
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DIR}/authentik-server/data:/data
      - ${DOCKER_DIR}/authentik-server/custom-templates:/templates
      - ${DOCKER_DIR}/letsencrypt/certs:/certs
    depends_on:
      authentik-server:
        condition: service_healthy
      authentik-db:
        condition: service_started
      authentik-redis:
        condition: service_started
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.12}

  authentik-db:
    <<: *service-base
    container_name: authentik-db
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PG_DB:-authentik}
    labels:
      traefik.enable: true
      traefik.tcp.routers.authentik-db.rule: HostSNI(`authentik-db.${DOMAIN}`)
      traefik.tcp.routers.authentik-db.entrypoints: postgres-tcp
      traefik.tcp.routers.authentik-db.tls: true
      traefik.tcp.routers.authentik-db.tls.certresolver: letsencrypt
      traefik.tcp.routers.authentik-db.tls.domains[0].main: authentik-db.${DOMAIN}
      traefik.tcp.routers.authentik-db.service: authentik-db
      traefik.tcp.services.authentik-db.loadbalancer.server.port: 5432
    volumes:
      - ${DOCKER_DATA_DIR}/authentik-db:/var/lib/postgresql/data
    image: docker.io/library/postgres:16-alpine

  authentik-redis:
    <<: *service-base
    container_name: authentik-redis
    networks:
      apps: {}
    command: --save 60 1 --loglevel warning
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ${DOCKER_DATA_DIR}/authentik-redis:/data
    image: docker.io/library/redis:alpine

  authentik-media:
    <<: *service-base
    container_name: authentik-media
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -Eq 'proxy|outpost|authentik'"]
      interval: 20s
      retries: 5
      start_period: 40s
      timeout: 5s
    environment:
      <<: *common-env
      AUTHENTIK_HOST: https://authentik-server:9443
      AUTHENTIK_INSECURE: true
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
      AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER}
    depends_on:
      authentik-server:
        condition: service_healthy
      authentik-db:
        condition: service_started
      authentik-redis:
        condition: service_started
    image: ghcr.io/goauthentik/proxy:${AUTHENTIK_TAG:-2025.10}

  uptime-kuma:
    <<: *service-base
    container_name: uptime-kuma
    hostname: uptime-kuma
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: curl --fail http://localhost:3001 || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    environment:
      <<: *common-env
    labels:
      traefik.enable: true
      traefik.http.routers.uptime-kuma.rule: Host(`uptime.${DOMAIN}`)
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.routers.uptime-kuma.tls: true
      traefik.http.routers.uptime-kuma.tls.certresolver: letsencrypt
      traefik.http.routers.uptime-kuma.tls.domains[0].main: uptime.${DOMAIN}
      traefik.http.routers.uptime-kuma.middlewares: authentik-dev@docker
      traefik.http.services.uptime-kuma.loadbalancer.server.port: 3001
      traefik.http.services.uptime-kuma.loadbalancer.server.scheme: http
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DIR}/uptime-kuma:/app/data
    image: louislam/uptime-kuma:2

  tokenhop:
    <<: *service-base
    container_name: tokenhop
    hostname: tokenhop
    init: true
    read_only: true
    # The upstream entrypoint repairs data ownership, then drops to the node user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources: { limits: { cpus: "2.0", memory: 1G, pids: 256 } }
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/health"]
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 5s
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${TOKENHOP_JWT_SECRET}
      INITIAL_PASSWORD: ${TOKENHOP_INITIAL_PASSWORD}
      API_KEY_SECRET: ${TOKENHOP_API_KEY_SECRET}
      MACHINE_ID_SALT: ${TOKENHOP_MACHINE_ID_SALT}
      AUTH_COOKIE_SECURE: ${TOKENHOP_AUTH_COOKIE_SECURE:-true}
      ENABLE_REQUEST_LOGS: ${TOKENHOP_ENABLE_REQUEST_LOGS:-false}
      BASE_URL: https://tokenhop.${DOMAIN}
      NEXT_PUBLIC_BASE_URL: https://tokenhop.${DOMAIN}
      # Upstream cloud endpoint still read by the app; unchanged by the rebrand.
      CLOUD_URL: https://9router.com
      NEXT_PUBLIC_CLOUD_URL: https://9router.com
      HEADROOM_URL: ${TOKENHOP_HEADROOM_URL:-http://headroom:8787}
      CLAUDE_CLI_VERSION: 2.1.280
      CLAUDE_CLI_SDK_VERSION: 0.112.1
      CLAUDE_CLI_RUNTIME_VERSION: v26.3.0
      GROK_CLI_VERSION: 1.0.44
      CODEX_CLI_VERSION: 0.160.0
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET}
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET}
      TOKENHOP_OWNER_EMAIL: ${TOKENHOP_OWNER_EMAIL}
      TOKENHOP_MULTI_USER: off
    depends_on:
      headroom:
        condition: service_healthy
    labels:
      traefik.enable: true
      traefik.http.routers.tokenhop.rule: Host(`tokenhop.${DOMAIN}`)
      traefik.http.routers.tokenhop.entrypoints: websecure
      traefik.http.routers.tokenhop.tls: true
      traefik.http.routers.tokenhop.tls.certresolver: letsencrypt
      traefik.http.routers.tokenhop.tls.domains[0].main: tokenhop.${DOMAIN}
      # OpenAI-compatible API: programmatic clients can't do Authentik's browser flow; native API keys guard /v1.
      # Longer rule = higher Traefik priority than the dashboard router above.
      traefik.http.routers.tokenhop-api.rule: Host(`tokenhop.${DOMAIN}`) && PathPrefix(`/v1`)
      traefik.http.routers.tokenhop-api.entrypoints: websecure
      traefik.http.routers.tokenhop-api.tls: true
      traefik.http.routers.tokenhop-api.tls.certresolver: letsencrypt
      traefik.http.services.tokenhop.loadbalancer.server.port: 20128
      traefik.http.services.tokenhop.loadbalancer.server.scheme: http
      <<: *tsdproxy-rfapps
      tsdproxy.name: "tokenhop"
      tsdproxy.dash.label: "tokenhop"
      tsdproxy.port.1: "443/https:20128/http"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${DOCKER_DIR}/tokenhop:/app/data
    image: ${TOKENHOP_IMAGE:-ghcr.io/tokenhop/tokenhop}:${TOKENHOP_TAG:-latest}

  headroom:
    <<: *service-base
    container_name: headroom
    hostname: headroom
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources: { limits: { cpus: "2.0", memory: 2G, pids: 256 } }
    networks:
      apps: {}
    logging: *logging-default
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 20s
      retries: 5
      start_period: 30s
      timeout: 5s
    environment:
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_PORT: 8787
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_MODE: ${HEADROOM_MODE:-cache}
      HEADROOM_SAVINGS_PROFILE: ${HEADROOM_SAVINGS_PROFILE:-coding}
      HEADROOM_BEACON: ${HEADROOM_BEACON:-off}
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
    labels:
      traefik.enable: true
      traefik.http.routers.headroom.rule: Host(`headroom.${DOMAIN}`)
      traefik.http.routers.headroom.entrypoints: websecure
      traefik.http.routers.headroom.tls: true
      traefik.http.routers.headroom.tls.certresolver: letsencrypt
      traefik.http.routers.headroom.tls.domains[0].main: headroom.${DOMAIN}
      traefik.http.services.headroom.loadbalancer.server.port: 8787
      traefik.http.services.headroom.loadbalancer.server.scheme: http
      <<: *tsdproxy-rfapps
      tsdproxy.name: "headroom"
      tsdproxy.dash.label: "Headroom"
      tsdproxy.port.1: "443/https:8787/http"
