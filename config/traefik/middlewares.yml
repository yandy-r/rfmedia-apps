http:
  middlewares:
    authentik-dev-file:
      forwardAuth:
        address: https://authentik-server:9443/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 1048576
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
        tls:
          insecureSkipVerify: true

    authentik-media-file:
      forwardAuth:
        address: https://authentik-media:9443/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 1048576
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
        tls:
          insecureSkipVerify: true
