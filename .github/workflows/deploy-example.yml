name: Deploy to Server (Example)

# This is an example GitHub Actions workflow for deploying using Ansible
# Customize this file to match your deployment requirements

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      command:
        description: 'Deployment command'
        required: true
        type: choice
        default: 'deploy'
        options:
          - sync
          - deploy
          - rebuild
      service:
        description: 'Specific service to deploy (optional)'
        required: false
        type: string
      skip_sync:
        description: 'Skip code synchronization'
        required: false
        type: boolean
        default: false

  # Uncomment to enable automatic deployment on push to specific branches
  # push:
  #   branches:
  #     - master      # Deploy to prod on push to master
  #     - staging     # Deploy to staging on push to staging

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-core

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install ansible.posix
          ansible-galaxy collection install community.general

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Set deployment variables
        id: vars
        run: |
          ENVIRONMENT="${{ inputs.environment || 'staging' }}"
          COMMAND="${{ inputs.command || 'deploy' }}"
          SERVICE="${{ inputs.service }}"
          SKIP_SYNC="${{ inputs.skip_sync }}"

          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "command=${COMMAND}" >> $GITHUB_OUTPUT

          # Build the deployment command
          DEPLOY_CMD="./ansible/deploy.sh ${ENVIRONMENT} ${COMMAND}"

          # Add service flag if specified
          if [[ -n "${SERVICE}" ]]; then
            DEPLOY_CMD="${DEPLOY_CMD} --service=${SERVICE}"
          fi

          # Add skip-sync flag if requested
          if [[ "${SKIP_SYNC}" == "true" ]]; then
            DEPLOY_CMD="${DEPLOY_CMD} --skip-sync"
          fi

          # Auto-confirm for CI/CD
          DEPLOY_CMD="${DEPLOY_CMD} --yes"

          echo "deploy_cmd=${DEPLOY_CMD}" >> $GITHUB_OUTPUT

      - name: Deploy to ${{ steps.vars.outputs.environment }}
        run: |
          cd ansible
          ${{ steps.vars.outputs.deploy_cmd }}

      - name: Deployment notification (success)
        if: success()
        run: |
          echo "✅ Deployment to ${{ steps.vars.outputs.environment }} completed successfully"
          # Add your notification logic here (Slack, Discord, etc.)

      - name: Deployment notification (failure)
        if: failure()
        run: |
          echo "❌ Deployment to ${{ steps.vars.outputs.environment }} failed"
          # Add your notification logic here (Slack, Discord, etc.)

# Required GitHub Secrets:
# - SSH_PRIVATE_KEY: Private SSH key for connecting to remote servers
# - SSH_KNOWN_HOSTS: Known hosts file content for SSH verification
#
# Optional GitHub Secrets:
# - ANSIBLE_VAULT_PASSWORD: If using Ansible Vault for secrets
#
# Setup Instructions:
# 1. Generate SSH key pair: ssh-keygen -t ed25519 -C "github-actions@yourdomain.com"
# 2. Add public key to remote server: ssh-copy-id -i ~/.ssh/id_ed25519.pub user@server
# 3. Add private key to GitHub Secrets as SSH_PRIVATE_KEY
# 4. Get known hosts: ssh-keyscan your-server.com > known_hosts
# 5. Add known_hosts content to GitHub Secrets as SSH_KNOWN_HOSTS
#
# Usage:
# 1. Go to Actions tab in GitHub repository
# 2. Select "Deploy to Server (Example)" workflow
# 3. Click "Run workflow"
# 4. Select environment, command, and optional service
# 5. Click "Run workflow" to start deployment
