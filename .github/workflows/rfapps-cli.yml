name: rfapps CLI

on:
  pull_request:
    paths:
      - ".github/workflows/rfapps-cli.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/rf-common/**"
      - "packages/rfapps-cli/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rfapps-cli.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/rf-common/**"
      - "packages/rfapps-cli/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build rf-common
        run: npm run build -w packages/rf-common

      - name: Typecheck rfapps CLI
        run: npm run typecheck --workspace packages/rfapps-cli

      - name: Test rfapps CLI
        run: npm run test:coverage --workspace packages/rfapps-cli
