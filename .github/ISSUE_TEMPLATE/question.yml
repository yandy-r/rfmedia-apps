name: Question
description: Ask for clarification, guidance, or usage help.
title: "[question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage and design questions.
        For private vulnerabilities, use the private security reporting link in the issue chooser.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I checked README/docs/troubleshooting first.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: Ask a single clear question.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and Context
      description: What are you trying to accomplish and why?
      placeholder: Desired outcome, constraints, and environment context.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What You Already Checked
      description: Docs, commands, issues, and experiments already tried.
      placeholder: Links or command attempts.
    validations:
      required: true
  - type: dropdown
    id: blocking_level
    attributes:
      label: Blocking Level
      options:
        - Not blocking
        - Workaround available
        - Blocking current work
      default: 1
    validations:
      required: true
  - type: textarea
    id: related_artifacts
    attributes:
      label: Related Commands, Files, or Services
      placeholder: List relevant commands, files, or compose services.
