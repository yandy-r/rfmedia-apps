name: Bug Report
description: Report broken behavior with reproduction and expected results.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects or regressions.
        Include reproducible steps and command output whenever possible.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and docs for this problem.
          required: true
        - label: I included exact reproduction steps and relevant logs.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise bug statement.
      placeholder: Describe what is broken.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Describe what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: Provide exact commands or steps.
      placeholder: |
        1. Run `...`
        2. Run `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Errors
      description: Include relevant output, stack traces, or screenshots.
      render: shell
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
      default: 1
    validations:
      required: true
  - type: dropdown
    id: affected_areas
    attributes:
      label: Affected Areas
      multiple: true
      options:
        - rfapps-cli
        - rfmedia-cli
        - plex
        - architecture
        - performance
        - testing
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Shell:
        - Node.js:
        - npm:
        - Command:
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Suspected Root Cause
      description: Optional initial analysis.
      placeholder: Describe likely root cause or area.
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Fix Acceptance Criteria
      placeholder: |
        - [ ] Reproduction no longer fails.
        - [ ] Added/updated tests to prevent regression.
    validations:
      required: true
