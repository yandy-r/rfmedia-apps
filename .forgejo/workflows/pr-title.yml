# Forgejo mirror of .github/workflows/pr-title.yml
# Third-party actions must use fully qualified GitHub URLs on Forgejo because
# DEFAULT_ACTIONS_URL (data.forgejo.org) only mirrors select actions/* repos.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate Conventional Commit PR title
    if: "!contains(github.server_url, 'github.com')"
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            style
          requireScope: false
          subjectPattern: '^(?!\[WIP\]|\[Draft\]|Initial plan|WIP:|Draft:).+'
          subjectPatternError: |
            The PR title subject "{subject}" looks like a placeholder.
            Remove "[WIP]" / "[Draft]" / "Draft:" / "WIP:" / "Initial plan"
            and use a Conventional Commit title — the PR title becomes the
            squash-merge commit subject and lands in CHANGELOG.md verbatim.
            Use GitHub's native Draft PR status for work-in-progress instead.
