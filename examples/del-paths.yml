# Example paths YAML file for rfmedia CLI (delete command)
#
# This file demonstrates all available options including:
# - defaults section for common settings
# - per-source overrides for filter, outputFolder, convert
# - range and count options for controlling delete count
# - automatic filter mode detection when filters are present
# - groups field for source selection with --group
# - artist field for source selection with --artist
#
# Usage:
#   rfmedia delete --paths examples/del-paths.yml --yes
#     → Auto-detects filter mode because 'filter' is specified in defaults/sources
#
#   rfmedia delete --filter liked --paths examples/del-paths.yml --yes
#     → Explicit filter mode with CLI filter as fallback for sources without one
#
# Source Selection:
#   rfmedia delete --paths examples/del-paths.yml --source-idx 2 --yes
#     → Process only source at index 2 (1-based)
#
#   rfmedia delete --paths examples/del-paths.yml --source-idx 1,3-5 --yes
#     → Process sources at indices 1, 3, 4, and 5
#
#   rfmedia delete --paths examples/del-paths.yml --source-name britney --yes
#     → Unified search: matches groups, artist, or basename (case-insensitive)
#
#   rfmedia delete --paths examples/del-paths.yml --group pop-divas --yes
#     → Process all sources in the "pop-divas" group
#
#   rfmedia delete --paths examples/del-paths.yml --artist "britney,taylor" --yes
#     → Process sources matching artist "britney" or "taylor"

destination: /data/media/music-manual
# destination: /data/media/music-temp

# Defaults apply to all sources unless overridden per-source
# Available defaults: filter, count, range, outputFolder, convert
defaults:
  filter: liked
  count: 2
  outputFolder: liked-songs

sources:
  # Source 1: Multiple groups (--group music-library or --group test)
  - media: music
    type: directory
    path: /data/media/music
    filter: rock-artists
    groups:
      - music-library
      - test

  # Source 2: Group "pop-divas" (--group pop-divas or --artist britney)
  - groups: pop-divas
    artist: Britney Spears
    type: directory
    media: music
    path: /data/media/music/Britney Spears (45a663b5-b1cb-4a91-bff6-2bef7bbfdd76)

  # Source 3: Same group, different artist (--group pop-divas or --artist mariah)
  - groups: pop-divas
    artist: Mariah Carey
    type: directory
    media: music
    path: /data/media/music/Mariah Carey (494e8d09-f85b-4543-892f-a5096aed1cd4)
    count: 3

  - groups: pop-divas
    artist: Christina Aguilera
    type: directory
    media: music
    path: /data/media/music/Christina Aguilera (b202beb7-99bd-47e7-8b72-195c8d72ebdd)

  - groups: pop-divas
    artist: Jessica Simpson
    type: directory
    media: music
    path: /data/media/music/Jessica Simpson (fe37acd4-893c-4b2c-8ad2-7fd394280354)

  - groups: pop-divas
    artist: Katy Perry
    type: directory
    media: music
    path: /data/media/music/Katy Perry (122d63fc-8671-43e4-9752-34e846d62a9c)

  # Multiple groups - belongs to TWO groups
  - artist: Shakira
    groups:
      - pop-divas
      - latin-divas
    type: directory
    media: music
    path: /data/media/music/Shakira (bf24ca37-25f4-4e34-9aec-460b94364cfc)

  # Multiple groups including "test"
  - groups:
      - pop-divas
      - test
    artist: Taylor Swift
    type: directory
    media: music
    path: /data/media/music/Taylor Swift (20244d07-534f-4eff-b4d4-930878889970)

  - groups: rock-favorites
    artist: Evanescence
    type: directory
    media: music
    path: /data/media/music/Evanescence (f4a31f0a-51dd-4fa7-986d-3095c40c5ed9)

  - groups: rock-favorites
    artist: Linkin Park
    type: directory
    media: music
    path: /data/media/music/Linkin Park (f59c5520-5f46-4d2c-b2c4-822eabf53419)

  - groups: rock-favorites
    artist: Disturbed
    type: directory
    media: music
    path: /data/media/music/Disturbed (4bb4e4e4-5f66-4509-98af-62dbb90c45c5)

  - groups: rock-favorites
    artist: Avril Lavigne
    type: directory
    media: music
    path: /data/media/music/Avril Lavigne (0103c1cc-4a09-4a5d-a344-56ad99a77193)

  # Source 13: Latin-divas group (--group latin-divas or --artist paulina)
  - groups: latin-divas
    artist: Paulina Rubio
    type: directory
    media: music
    path: /data/media/music/Paulina Rubio (5938c629-1d06-480b-9780-859b153af11e)
