filters:
  # Filter for tracks rated 3+ stars
  # Good for creating a broader "liked" collection
  liked:
    match: all
    rules:
      - type: rule
        field: rating
        operator: ">="
        value: 3.0 # 3+ stars

  # Filter for high-quality rock tracks - 3.5+ stars and rock genre
  high-quality-rock:
    match: all
    rules:
      - type: rule
        field: rating
        operator: ">="
        value: 3.5
      - type: group
