copy:
  outputFolder: liked-songs
  hardlink: false
  force: false
  workers: 8
  progress: true
  albumOnly: false
  preserveStructure: false
  albumMode: true
  trackCompleted: true
  deleteDowngraded: true
  diskSpaceMargin: 5
  requireDiskSpace: false
clean:
  force: false
  minFiles: 1
  exclude: []
  useTrash: false
watch:
  outputFolder: liked-songs
  hardlink: false
  debounceMs: 5000
  albumOnly: false
  preserveStructure: false
linkVideos:
  minScore: 70
  preferredFormat: mkv
  progress: true
global:
  debug: false
plex:
  url: "{{ PLEX_MUSIC_URL }}"
  token: "{{ PLEX_MUSIC_TOKEN }}"
  scanAfterCopy: true
  scanPerSource: true
  libraries:
    - library: Music
      path: /data/media/music
    - library: Music
      path: /data/media/music-tidal
undo:
  enabled: true
  retentionDays: 30
  maxSizeMB: 100

discovery:
  lastfm:
    apiKey: "{{ LASTFM_API_KEY }}"
    timeoutMs: 15000

