# Example paths YAML file for rfmedia CLI
#
# This file demonstrates all available options including:
# - defaults section for common settings
# - per-source overrides for filter, outputFolder, convert
# - range and count options for controlling copy count
# - automatic filter mode detection when filters are present
# - groups field for source selection with --group
# - artist field for source selection with --artist
# - multi-group support (source can belong to multiple groups)
# - multi-field matching (groups, artist, and basename)
#
# Usage:
#   rfmedia copy --paths examples/paths.yml
#     → Auto-detects filter mode because 'filter' is specified in defaults/sources
#
#   rfmedia copy --filter liked --paths examples/paths.yml
#     → Explicit filter mode with CLI filter as fallback for sources without one
#
#   rfmedia sync --paths examples/paths.yml
#     → Sync with automatic filter mode detection
#
# Source Selection:
#   rfmedia copy --paths examples/paths.yml --source-idx 2
#     → Process only source at index 2 (1-based)
#
#   rfmedia copy --paths examples/paths.yml --source-idx 1,3-5
#     → Process sources at indices 1, 3, 4, and 5
#
#   rfmedia copy --paths examples/paths.yml --source-name britney
#     → Unified search: matches groups, artist, or basename (case-insensitive)
#
#   rfmedia copy --paths examples/paths.yml --group pop-divas
#     → Process all sources in the pop-divas group (includes sources 2-8)
#
#   rfmedia copy --paths examples/paths.yml --group rock-favorites
#     → Process all sources in the rock-favorites group (includes sources 9-12)
#
#   rfmedia copy --paths examples/paths.yml --artist "shakira,taylor"
#     → Process sources matching artist "shakira" or "taylor"
#
# Multi-field matching:
#   - --source-name: Matches against groups, artist, and basename(path)
#   - --group: Matches only against groups field
#   - --artist: Matches only against artist field
#   - Example: Shakira can be selected by --group pop-divas, --group latin-divas, or --artist shakira
#
# Display name for logging: groups[0] ?? artist ?? basename(path)

destination: /data/media/music-manual

# Defaults apply to all sources unless overridden per-source
# Available defaults: filter, count, range, outputFolder, convert
defaults:
  filter: liked # Smart filter name from config
  count: 5 # Number of copies to create (mutually exclusive with range)
  outputFolder: liked-songs # Output folder for filter mode

sources:
  # Source 1: Custom group for selection (--group music-library)
  - groups: music-library
    media: music
    type: directory
    path: /data/media/music
    filter: high-quality-rock
    range: 001-005

  # Source 2: Group "pop-divas" (--group pop-divas, or --artist britney)
  - groups: pop-divas
    artist: Britney Spears
    type: directory
    media: music
    path: /data/media/music/Britney Spears (45a663b5-b1cb-4a91-bff6-2bef7bbfdd76)
    count: 3
    # convert: alac

  # Source 3: Group member with per-source range (--group pop-divas or --artist mariah)
  - groups: pop-divas
    artist: Mariah Carey
    type: directory
    media: music
    path: /data/media/music/Mariah Carey (494e8d09-f85b-4543-892f-a5096aed1cd4)
    range: 001-003

  # Source 4: Another pop-divas member (--group pop-divas or --artist christina)
  - groups: pop-divas
    artist: Christina Aguilera
    type: directory
    media: music
    path: /data/media/music/Christina Aguilera (b202beb7-99bd-47e7-8b72-195c8d72ebdd)
    count: 5

  # Source 5: Group member with range (--group pop-divas or --artist jessica)
  - groups: pop-divas
    artist: Jessica Simpson
    type: directory
    media: music
    path: /data/media/music/Jessica Simpson (fe37acd4-893c-4b2c-8ad2-7fd394280354)
    range: 001-008

  # Source 6: Pop-divas member (--group pop-divas or --artist katy)
  - groups: pop-divas
    artist: Katy Perry
    type: directory
    media: music
    path: /data/media/music/Katy Perry (122d63fc-8671-43e4-9752-34e846d62a9c)
    range: 001-007

  # Source 7: Multi-group example - belongs to TWO groups
  # Can be selected by: --group pop-divas, --group latin-divas, or --artist shakira
  - artist: Shakira
    groups:
      - pop-divas
      - latin-divas
    type: directory
    media: music
    path: /data/media/music/Shakira (bf24ca37-25f4-4e34-9aec-460b94364cfc)

  # Source 8: Pop-divas member (--group pop-divas or --artist taylor)
  - groups: pop-divas
    artist: Taylor Swift
    type: directory
    media: music
    path: /data/media/music/Taylor Swift (20244d07-534f-4eff-b4d4-930878889970)

  # Source 9: Rock-favorites group (--group rock-favorites or --artist evanescence)
  - groups: rock-favorites
    artist: Evanescence
    type: directory
    media: music
    path: /data/media/music/Evanescence (f4a31f0a-51dd-4fa7-986d-3095c40c5ed9)
    count: 7

  # Source 10: Rock-favorites member (--group rock-favorites or --artist linkin)
  - groups: rock-favorites
    artist: Linkin Park
    type: directory
    media: music
    path: /data/media/music/Linkin Park (f59c5520-5f46-4d2c-b2c4-822eabf53419)
    count: 4

  # Source 11: Rock-favorites member (--group rock-favorites or --artist disturbed)
  - groups: rock-favorites
    artist: Disturbed
    type: directory
    media: music
    path: /data/media/music/Disturbed (4bb4e4e4-5f66-4509-98af-62dbb90c45c5)
    count: 4

  # Source 12: Rock-favorites member (--group rock-favorites or --artist avril)
  - groups: rock-favorites
    artist: Avril Lavigne
    type: directory
    media: music
    path: /data/media/music/Avril Lavigne (0103c1cc-4a09-4a5d-a344-56ad99a77193)
    count: 6
    # convert: mp3

  # Source 13: Latin-divas group (--group latin-divas or --artist paulina)
  - groups: latin-divas
    artist: Paulina Rubio
    type: directory
    media: music
    path: /data/media/music/Paulina Rubio (5938c629-1d06-480b-9780-859b153af11e)
    count: 20
