# Plex Filters Configuration Examples
# ====================================
#
# This file demonstrates the plexFilters configuration section for
# defining reusable, named filter definitions for Plex library queries.
#
# YAML Indentation: Use 2 spaces per indent level (not tabs).
#
# Usage:
#   rfmedia plex query run -l Music -t track --filter <filter-name>
#
# Rating values: Use 1-5 stars (e.g., 4 = 4 stars).
# The filter engine converts to Plex's 0-10 scale internally.

plexFilters:
  # ===========================================================================
  # BASIC FILTERS - Single Rule Examples
  # ===========================================================================

  # Filter for highly-rated artists (4+ stars)
  # Works with all media types: artist, album, track
  high-rated-artists:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4

  # Filter for tracks from highly-rated albums (4+ stars)
  # albumRating applies to album and track queries only
  great-albums:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: albumRating
        operator: ">="
        value: 4

  # Filter for high-rated individual tracks (4+ stars)
  # trackRating applies to track queries only
  favorite-tracks:
    match: all
    library: Music
    type: track
    limit: 100
    rules:
      - type: rule
        field: trackRating
        operator: ">="
        value: 4

  # Filter by specific artist name (exact match)
  britney-spears:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artist
        operator: "=="
        value: Britney Spears

  # Filter by artist name (partial match, case-insensitive)
  taylor-artists:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artist
        operator: contains
        value: Taylor

  # Filter by album name
  greatest-hits-albums:
    match: all
    library: Music
    type: album
    rules:
      - type: rule
        field: album
        operator: contains
        value: Greatest Hits

  # Filter by track title
  love-songs:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: title
        operator: contains
        value: Love

  # Filter by genre (case-insensitive partial match)
  pop-music:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: genre
        operator: contains
        value: Pop

  # Filter by exact year
  year-2024:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: year
        operator: "=="
        value: 2024

  # Filter by year range (2020 or later)
  recent-releases:
    match: all
    library: Music
    type: album
    rules:
      - type: rule
        field: minYear
        operator: ">="
        value: 2020

  # Filter by year range (before 2000)
  classics:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: maxYear
        operator: "<="
        value: 1999

  # Filter by play count (frequently played)
  popular-tracks:
    match: all
    library: Music
    type: track
    limit: 50
    rules:
      - type: rule
        field: minPlays
        operator: ">="
        value: 10

  # ===========================================================================
  # COMBINED FILTERS - Multiple Rules with AND Logic
  # ===========================================================================

  # Highly-rated pop tracks from a specific artist
  # All rules must match (AND logic)
  britney-best:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artist
        operator: "=="
        value: Britney Spears
      - type: rule
        field: artistRating
        operator: ">="
        value: 3
      - type: rule
        field: trackRating
        operator: ">="
        value: 4

  # High-rated rock tracks from the 80s
  eighties-rock:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: genre
        operator: contains
        value: Rock
      - type: rule
        field: minYear
        operator: ">="
        value: 1980
      - type: rule
        field: maxYear
        operator: "<="
        value: 1989
      - type: rule
        field: artistRating
        operator: ">="
        value: 3

  # Frequently played favorites (popular AND highly rated)
  certified-bangers:
    match: all
    library: Music
    type: track
    limit: 100
    rules:
      - type: rule
        field: minPlays
        operator: ">="
        value: 5
      - type: rule
        field: trackRating
        operator: ">="
        value: 4

  # ===========================================================================
  # OR LOGIC FILTERS - Any Rule Matches
  # ===========================================================================

  # Tracks from any of these pop divas
  # At least one rule must match (OR logic)
  pop-divas:
    match: any
    library: Music
    type: track
    rules:
      - type: rule
        field: artist
        operator: "=="
        value: Britney Spears
      - type: rule
        field: artist
        operator: "=="
        value: Madonna
      - type: rule
        field: artist
        operator: "=="
        value: Lady Gaga
      - type: rule
        field: artist
        operator: "=="
        value: Beyoncé

  # Multiple genres (Pop OR Dance OR Electronic)
  dance-party:
    match: any
    library: Music
    type: track
    rules:
      - type: rule
        field: genre
        operator: contains
        value: Pop
      - type: rule
        field: genre
        operator: contains
        value: Dance
      - type: rule
        field: genre
        operator: contains
        value: Electronic

  # ===========================================================================
  # NESTED FILTERS - Complex Boolean Logic with Groups
  # ===========================================================================

  # Highly-rated tracks from multiple artists (nested OR within AND)
  # Logic: (artistRating >= 4) AND (artist is Britney OR artist is Madonna)
  rated-divas:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4
      - type: group
        match: any
        rules:
          - type: rule
            field: artist
            operator: "=="
            value: Britney Spears
          - type: rule
            field: artist
            operator: "=="
            value: Madonna

  # Pop or Rock tracks that are highly rated
  # Logic: (artistRating >= 3) AND (genre contains Pop OR genre contains Rock)
  rated-pop-rock:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 3
      - type: group
        match: any
        rules:
          - type: rule
            field: genre
            operator: contains
            value: Pop
          - type: rule
            field: genre
            operator: contains
            value: Rock

  # Complex example: Recent popular tracks in specific genres
  # Logic: (minPlays >= 5) AND (year >= 2020) AND (Pop OR Electronic OR Dance)
  recent-dance-hits:
    match: all
    library: Music
    type: track
    limit: 200
    rules:
      - type: rule
        field: minPlays
        operator: ">="
        value: 5
      - type: rule
        field: minYear
        operator: ">="
        value: 2020
      - type: group
        match: any
        rules:
          - type: rule
            field: genre
            operator: contains
            value: Pop
          - type: rule
            field: genre
            operator: contains
            value: Electronic
          - type: rule
            field: genre
            operator: contains
            value: Dance

  # Advanced: Either highly rated OR frequently played
  # Logic: (trackRating >= 4) OR (minPlays >= 20)
  favorites-or-popular:
    match: any
    library: Music
    type: track
    rules:
      - type: rule
        field: trackRating
        operator: ">="
        value: 4
      - type: rule
        field: minPlays
        operator: ">="
        value: 20

  # ===========================================================================
  # DEEPLY NESTED - Multi-Level Boolean Logic
  # ===========================================================================

  # Complex 3-level nesting example
  # Logic: (artistRating >= 3) AND (
  #   (genre=Pop AND year >= 2015) OR
  #   (genre=Rock AND trackRating >= 4)
  # )
  complex-filter:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 3
      - type: group
        match: any
        rules:
          # Option 1: Recent pop
          - type: group
            match: all
            rules:
              - type: rule
                field: genre
                operator: contains
                value: Pop
              - type: rule
                field: minYear
                operator: ">="
                value: 2015
          # Option 2: Highly-rated rock
          - type: group
            match: all
            rules:
              - type: rule
                field: genre
                operator: contains
                value: Rock
              - type: rule
                field: trackRating
                operator: ">="
                value: 4

  # ===========================================================================
  # FILTER DEFAULTS - Library, Type, and Limit Presets
  # ===========================================================================

  # Filter with all defaults specified
  # These can be overridden with CLI options
  quick-favorites:
    match: all
    library: Music # Default library (overridden by --library)
    type: track # Default media type (overridden by --type)
    limit: 50 # Default result limit (overridden by --limit)
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4
      - type: rule
        field: trackRating
        operator: ">="
        value: 3

  # Album-focused filter
  top-albums:
    match: all
    library: Music
    type: album
    limit: 25
    rules:
      - type: rule
        field: albumRating
        operator: ">="
        value: 4

  # Artist-focused filter
  favorite-artists:
    match: all
    library: Music
    type: artist
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4

  # ===========================================================================
  # STYLE AND MOOD FILTERS
  # ===========================================================================
  #
  # Style and mood are tag-based metadata fields populated by Plex's premium
  # metadata system. Not all libraries will have style/mood data available.
  #
  # IMPORTANT: Styles are only available on artists and albums.
  # Moods can apply to all media types including tracks.
  #

  # Simple style filter - filter for jazz artists
  jazz-artists:
    match: all
    library: Music
    type: artist
    rules:
      - type: rule
        field: style
        operator: contains
        value: Jazz

  # Simple mood filter - filter for relaxing albums
  relaxing-albums:
    match: all
    library: Music
    type: album
    rules:
      - type: rule
        field: mood
        operator: contains
        value: Relaxing

  # Combined filter with style and genre - jazz fusion artists
  jazz-fusion:
    match: all
    library: Music
    type: artist
    rules:
      - type: rule
        field: genre
        operator: contains
        value: Jazz
      - type: rule
        field: style
        operator: contains
        value: Fusion

  # Mood filter with rating - highly rated energetic tracks
  energetic-favorites:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: mood
        operator: contains
        value: Energetic
      - type: rule
        field: trackRating
        operator: ">="
        value: 4

  # ===========================================================================
  # NEGATIVE OPERATORS - Exclusion Filters
  # ===========================================================================
  #
  # The != and not_contains operators enable exclusion-based filtering.
  # These operators are pushed to the Plex API server-side for efficient
  # filtering. The Plex API supports:
  # - String: != (does not contain), !== (does not equal exactly)
  # - Integer: != (not equals)
  #

  # Exclude specific artist using not_contains
  # Filters out any track where artist name contains "Beatles"
  not-beatles:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artist
        operator: not_contains
        value: Beatles

  # High-rated non-classical music
  # Combines positive rating filter with genre exclusions
  non-classical-favorites:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4
      - type: rule
        field: genre
        operator: not_contains
        value: Classical
      - type: rule
        field: genre
        operator: not_contains
        value: Opera

  # Exclude unrated content using != operator
  # Only includes tracks where artist has been rated (rating != 0)
  rated-only:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: "!="
        value: 0

  # Exclude compilation albums
  # High-rated tracks not from "Greatest Hits" or compilation albums
  originals-only:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: artistRating
        operator: ">="
        value: 4
      - type: rule
        field: album
        operator: not_contains
        value: "Greatest Hits"
      - type: rule
        field: album
        operator: not_contains
        value: "Best Of"
      - type: rule
        field: album
        operator: not_contains
        value: "Compilation"

  # Exclude specific genre using != for exact match exclusion
  # Tracks where genre is not exactly "Country"
  not-country:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: genre
        operator: "!="
        value: Country

  # Complex exclusion: High-rated tracks excluding multiple moods
  # Demonstrates combining positive and negative filters
  upbeat-favorites:
    match: all
    library: Music
    type: track
    rules:
      - type: rule
        field: trackRating
        operator: ">="
        value: 4
      - type: rule
        field: mood
        operator: not_contains
        value: Sad
      - type: rule
        field: mood
        operator: not_contains
        value: Melancholy
      - type: rule
        field: mood
        operator: not_contains
        value: Somber

  # Nested exclusion: Pop or Rock tracks that are NOT from tribute bands
  # Demonstrates negative operators with nested groups
  non-tribute-pop-rock:
    match: all
    library: Music
    type: track
    rules:
      - type: group
        match: any
        rules:
          - type: rule
            field: genre
            operator: contains
            value: Pop
          - type: rule
            field: genre
            operator: contains
            value: Rock
      - type: rule
        field: artist
        operator: not_contains
        value: Tribute
      - type: rule
        field: album
        operator: not_contains
        value: Tribute

  # ===========================================================================
  # OPERATOR REFERENCE
  # ===========================================================================
  #
  # | Operator     | Works With              | Description                         |
  # |--------------|-------------------------|-------------------------------------|
  # | >=           | numbers                 | Greater than or equal               |
  # | <=           | numbers                 | Less than or equal                  |
  # | ==           | all types               | Exact match                         |
  # | !=           | all types               | Not equal (server-side)             |
  # | contains     | text fields only        | Case-insensitive substring          |
  # | not_contains | text fields only        | Substring exclusion (server-side)   |
  #
  # ===========================================================================
  # FIELD REFERENCE
  # ===========================================================================
  #
  # | Field        | Type       | Works With         | Description            |
  # |--------------|------------|--------------------|-----------------------|
  # | artist       | text       | all types          | Artist name            |
  # | album        | text       | album, track       | Album name             |
  # | title        | text       | all types          | Item title             |
  # | genre        | text       | all types          | Genre tag              |
  # | style        | text       | artist, album      | Style tag (premium)    |
  # | mood         | text       | all types          | Mood tag (premium)     |
  # | artistRating | number 1-5 | all types          | Artist star rating     |
  # | albumRating  | number 1-5 | album, track       | Album star rating      |
  # | trackRating  | number 1-5 | track only         | Track star rating      |
  # | year         | number     | all types          | Exact release year     |
  # | minYear      | number     | all types          | Minimum year           |
  # | maxYear      | number     | all types          | Maximum year           |
  # | minPlays     | number     | all types          | Minimum play count     |
  #
  # ===========================================================================
  # HYBRID FILTERING STRATEGY
  # ===========================================================================
  #
  # The Plex API only supports AND logic natively. When your filter uses:
  #
  # - Pure AND (match: all, no groups): Server-side filtering (fast)
  # - Any OR logic (match: any or groups): Hybrid filtering
  #   - Compatible conditions sent to server
  #   - Full filter applied client-side on results
  #   - Extra results fetched to account for filtering (3x limit)
  #
  # For best performance, prefer simple AND filters when possible.
  #
